name: Packaging contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Controlled failure for branch-protection qualification
        if: github.event_name == 'pull_request' && github.head_ref == 'test/ci-protection-1'
        run: |
          sleep 45
          echo '::error::Intentional failure to qualify required-check enforcement (issue #1).'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install packaging validators
        run: sudo apt-get update && sudo apt-get install -y rpm desktop-file-utils
      - name: Test source and RPM contracts
        run: |
          python3 -m unittest discover -s tests -v
          rpmspec -P zed.spec >/dev/null
          bash -n zed-launcher
